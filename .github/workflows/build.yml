name: Build XITFORGE iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Verify project files
        run: |
          test -f JASONXIT.xcodeproj/project.pbxproj
          test -f JASONXIT/Info.plist
          echo "Project found: JASONXIT.xcodeproj"

      - name: Build unsigned app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild clean build \\
            -project JASONXIT.xcodeproj \\
            -scheme JASONXIT \\
            -configuration Release \\
            -sdk iphoneos \\
            -destination 'generic/platform=iOS' \\
            -derivedDataPath build \\
            CODE_SIGNING_ALLOWED=NO \\
            CODE_SIGNING_REQUIRED=NO \\
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name 'JASONXIT.app' -type d | head -n 1)
          test -d "$APP_PATH"
          rm -rf Payload XITFORGE.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/JASONXIT.app
          /usr/bin/zip -qry XITFORGE.ipa Payload
          unzip -t XITFORGE.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XITFORGE-unsigned-IPA
          path: XITFORGE.ipa
          if-no-files-found: error
